<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Builder</title>
    <link rel="icon" href="https://cdn2.steamgriddb.com/icon_thumb/db261d4f615f0e982983be499e57ccda.png"
        type="image/png">

    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/fleet-builder.css">
    <link rel="stylesheet" href="style/equip-data.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="top-navbar" id="global-navbar"></nav>

    <div class="container" style="display: flex; flex-direction: column; align-items: center;">
        <h1 class="main-title">FLEET BUILDER</h1>

        <!-- Vùng Nút Cài Đặt và Khung Menu Sổ Xuống -->
        <div class="settings-menu-wrapper">
            <button type="button" id="settingsToggleBtn" class="settings-toggle-btn" onclick="toggleSettingsMenu()">Cài Đặt ▼</button>
            <div id="settingsPanel" class="settings-panel hidden">
                <button type="button" id="globalToggleHeaderBtn" class="toggle-header-global-btn" onclick="toggleGlobalFleetHeaders()">Thanh Chức Năng</button>
            </div>
        </div>

        <!-- Vùng chứa các Box Đội hình -->
        <div id="fleet-builder-container"></div>
    </div>

    <!-- Popup (Modal) Chọn Tàu -->
    <div id="shipSelectionModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>CHỌN TÀU</h2>
                <div class="modal-header-actions">
                    <button type="button" class="filter-toggle-btn" onclick="toggleFilter(this)">Mở Bộ Lọc ▼</button>
                    <button type="button" class="modal-close-btn" onclick="closeShipModal()">Đóng</button>
                </div>
            </div>
            <div class="modal-body" id="shipModalGrid">
                <!-- Danh sách icon tàu sẽ được JS đổ vào đây -->
            </div>
        </div>
    </div>

    <script src="nav-mesh.js"></script>
    <script src="fleet-builder/fleet-builder-data.js"></script>
</body>

</html>
